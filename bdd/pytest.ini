; Конфигурация слоя исполняемых сценариев проекта videos.
;
; Отдельный ini, а не [tool.pytest.ini_options] в pyproject.toml: pyproject
; может принадлежать апстриму, наша строка там даст конфликт при слиянии.
; Каталог bdd/ — свой, апстрим его не знает.
;
; Запуск:  pytest -c bdd/pytest.ini bdd
; Гейт:    agent-ops spec-check <change> <номер-задачи>
; rootdir = bdd, пути ниже относительны ему.
[pytest]
testpaths = .
python_files = test_*.py
bdd_features_base_dir = features
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
