# /etc/sysctl.d/99-memory-optimization.conf
#
# Memory + swap tuning для MSI Raider 18 HX AI A2XWJG (62 GiB RAM + 279 GiB swap on NVMe).
# Применено 2026-05-15 после диагностики thrashing → input event delays.
#
# Цель: предотвратить swap thrashing когда heavy workload (LM Studio + PyCharm + MCP servers)
# съедает RAM. Видели задержки 5-60 сек на BTN_LEFT release из-за того что Xorg уходил
# в swap → release event ждал в очереди пока страница читалась с диска.
#
# Откат: rm этот файл + перезагрузка (или вернуть defaults через sysctl).

# Reserve больше памяти для kernel — на 64GB system дефолт 66MB слишком мал.
# 256MB headroom предотвращает internal OOM при memory spikes.
vm.min_free_kbytes = 262144

# Watermark scale — насколько активно kernel начинает reclaim memory.
# Дефолт 10 = 0.1% от zone. Поднимаем до 100 = 1%. Kernel начнёт чистить
# cache раньше → не доходит до thrashing.
vm.watermark_scale_factor = 100

# Page cluster — сколько страниц читать из swap за раз. Дефолт 3 (=8 страниц).
# Для SSD оптимально 0 (=1 страница) — меньше bandwidth waste на не-нужные страницы.
vm.page-cluster = 0
