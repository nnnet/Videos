# /etc/tlp.d/10-elan-31fd-no-pm.conf
#
# Запрещаем TLP трогать runtime PM на Intel LPSS I2C controller.
# Парный фикс к /etc/udev/rules.d/70-elan-31fd-runtime-pm.rules.
#
# Без этого: udev rule выставит power/control=on при add-event,
# но TLP при следующем switch AC/BAT вернёт обратно на auto.
#
# Откат: rm этот файл + sudo tlp start.

# RUNTIME_PM на батарее тоже "on" — на твоём железе any-form auto = баг
RUNTIME_PM_ON_BAT=on

# intel_lpss_pci — driver контроллера на котором висит i2c-CUST0001:00 (ELAN tp).
# mei_me/nouveau/radeon — дефолтные из defaults.conf, сохраняем.
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau radeon intel_lpss_pci"
